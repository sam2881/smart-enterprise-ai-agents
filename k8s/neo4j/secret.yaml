apiVersion: v1
kind: Secret
metadata:
  name: neo4j-auth
  namespace: ai-agent
type: Opaque
stringData:
  # Value injected by CI/CD via: kubectl create secret generic neo4j-auth --from-literal=password=<value>
  # Do not hardcode here — this file is a template only
  NEO4J_AUTH: "neo4j/REPLACE_WITH_SECRET"
