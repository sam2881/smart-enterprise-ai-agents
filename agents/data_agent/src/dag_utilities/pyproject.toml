[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dag_utilities"
version = "1.0.0"
description = "APEX DAG Utilities - Shared library for all Airflow DAGs"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
