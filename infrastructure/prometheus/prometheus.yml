global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: ai-agent-platform
    env: local

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: backend-api
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: data-agent-api
    static_configs:
      - targets: ['host.docker.internal:8001']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 15s
