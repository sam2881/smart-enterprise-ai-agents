groups:
  - name: ai-agent-platform
    interval: 30s
    rules:
      - alert: BackendAPIDown
        expr: up{job="backend-api"} == 0
        for: 1m
        labels:
          severity: critical
          system: incident-management
        annotations:
          summary: "Backend API is down"
          description: "Backend API at port 8000 has been unreachable for more than 1 minute."

      - alert: DataAgentAPIDown
        expr: up{job="data-agent-api"} == 0
        for: 1m
        labels:
          severity: critical
          system: data-engineering
        annotations:
          summary: "Data Agent API is down"
          description: "Data Agent API at port 8001 has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(errors_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanize }} errors/sec over the last 5 minutes."

      - alert: LLMCallFailureRateHigh
        expr: |
          (rate(llm_calls_total{status="error"}[5m]) / rate(llm_calls_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "LLM call failure rate exceeds 5%"
          description: "LLM failure rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: ApprovalQueueDepth
        expr: approvals_pending_total > 10
        for: 10m
        labels:
          severity: warning
          system: approval-workflow
        annotations:
          summary: "Approval queue has {{ $value }} pending items"
          description: "More than 10 approvals have been pending for over 10 minutes. Human intervention required."

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker is OPEN"
          description: "The circuit breaker has been in OPEN state for more than 1 minute, indicating repeated failures."

      - alert: RAGRelevanceLow
        expr: rag_result_count_total{status="low_confidence"} > 5
        for: 5m
        labels:
          severity: warning
          system: rag
        annotations:
          summary: "RAG returning low-confidence results"
          description: "{{ $value }} low-confidence RAG results in the last 5 minutes. Knowledge base may need updating."

      - alert: IncidentResolutionLatencyHigh
        expr: |
          histogram_quantile(0.99, rate(workflow_node_duration_seconds_bucket[5m])) > 300
        for: 5m
        labels:
          severity: warning
          system: incident-management
        annotations:
          summary: "P99 incident resolution latency exceeds 5 minutes"
          description: "P99 latency is {{ $value | humanizeDuration }}. SLA target is 300s."
