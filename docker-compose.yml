# =============================================================================
# AI Agent Platform - Unified Docker Compose
# =============================================================================
#
# ARCHITECTURE: Event-Driven with Kafka as System of Record
#
# Flow:
#   MCP Servers sense → Kafka → Orchestrator routes → LangGraph reasons
#   → Airflow MCP executes DAG operations → Kafka → MCP closes tickets
#
# SERVICES:
#   Infrastructure: Kafka, PostgreSQL, Redis, Weaviate, Neo4j
#   Orchestration:  Airflow (Local DAG execution)
#   MCP Servers:    ServiceNow, Jira, Airflow, GitHub
#   Applications:   Orchestrator, Data Agent, Frontend
#   Observability:  Prometheus, Grafana, Tempo, LangFuse
#
# USAGE:
#   docker-compose up -d                    # Start all
#   docker-compose up -d kafka postgres     # Core only
#   docker-compose logs -f orchestrator     # View logs
#
# =============================================================================

version: "3.9"

services:

  # ==========================================================================
  # MESSAGE QUEUE LAYER - Kafka (System of Record)
  # ==========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ai-agent-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ai-agent-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ai-agent-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_NAME: "ai-agent"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

  # Initialize Kafka topics
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ai-agent-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for Kafka...'
        cub kafka-ready -b kafka:9092 1 120

        echo 'Creating topics...'

        # Incident Management Topics (ServiceNow)
        kafka-topics --create --if-not-exists --topic incident.created --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic incident.received --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic incident.enriched --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic incident.plan_generated --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic incident.requires_approval --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic incident.approved --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic incident.rejected --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic incident.close_execute --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic incident.closed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1

        # Remediation Topics (Airflow MCP)
        kafka-topics --create --if-not-exists --topic remediation.started --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic remediation.executed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic airflow.trigger_dag --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic airflow.retry_dag --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic airflow.dag_completed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic airflow.dag_failed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1

        # GitHub MCP Topics (Remediation via GitHub Actions - test_01 repo)
        kafka-topics --create --if-not-exists --topic github.trigger_workflow --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic github.get_workflow_status --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic github.workflow_completed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic github.workflow_failed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic github.commit_file --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic github.create_pr --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1

        # Data Pipeline Topics (Jira/Data Agent)
        kafka-topics --create --if-not-exists --topic pipeline.requested --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic pipeline.progress --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic pipeline.completed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --topic pipeline.failed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1

        # Agent Events (shared)
        kafka-topics --create --if-not-exists --topic agent.events --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1

        echo 'Topics created!'
        kafka-topics --list --bootstrap-server kafka:9092
      "
    networks:
      - agent-network

  # ==========================================================================
  # DATABASE & CACHE LAYER
  # ==========================================================================

  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: ai-agent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-agentdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # VECTOR & GRAPH DATABASES (RAG)
  # ==========================================================================

  weaviate:
    image: semitechnologies/weaviate:1.24.1
    container_name: ai-agent-weaviate
    ports:
      - "8081:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "50"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      ENABLE_MODULES: "text2vec-openai"
      CLUSTER_HOSTNAME: "weaviate"
      DEFAULT_VECTORIZER_MODULE: "text2vec-openai"
      OPENAI_APIKEY: ${OPENAI_API_KEY:-}
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  neo4j:
    image: neo4j:5.20-community
    container_name: ai-agent-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-adminadmin}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================================================
  # AIRFLOW (Local DAG Orchestration)
  # ==========================================================================

  airflow-scheduler:
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    container_name: ai-agent-airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-admin-secret-key}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp-key.json
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_REGION: ${GCP_REGION:-us-central1}
      # APEX Runtime Configuration
      APEX_METADATA_DB: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-agentdb}
      APEX_SPARK_JOBS_PATH: /opt/airflow/spark_jobs
      # GCS Buckets (Medallion Architecture)
      GCS_BUCKET_RAW: ${GCS_BUCKET_RAW:-}
      GCS_BUCKET_BRONZE: ${GCS_BUCKET_BRONZE:-}
      GCS_BUCKET_SILVER: ${GCS_BUCKET_SILVER:-}
      GCS_BUCKET_GOLD: ${GCS_BUCKET_GOLD:-}
      GCS_BUCKET_TEMP: ${GCS_BUCKET_TEMP:-}
      # BigQuery
      BIGQUERY_DATASET: ${BIGQUERY_DATASET:-data_warehouse}
      BIGQUERY_LOCATION: ${BIGQUERY_LOCATION:-US}
      # Dataproc
      DATAPROC_CLUSTER: ${DATAPROC_CLUSTER:-}
      DATAPROC_REGION: ${DATAPROC_REGION:-us-central1}
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./infrastructure/gcp-key.json}:/opt/airflow/gcp-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

  airflow-webserver:
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    container_name: ai-agent-airflow-webserver
    command: webserver
    ports:
      - "8083:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-admin-secret-key}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp-key.json
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      # APEX Runtime Configuration
      APEX_METADATA_DB: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-agentdb}
      APEX_SPARK_JOBS_PATH: /opt/airflow/spark_jobs
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./infrastructure/gcp-key.json}:/opt/airflow/gcp-key.json:ro
    depends_on:
      - airflow-scheduler
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    container_name: ai-agent-airflow-init
    entrypoint: >
      /bin/bash -c "
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
        echo 'Airflow initialized!'
      "
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs=}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./infrastructure/gcp-key.json}:/opt/airflow/gcp-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-network

  # ==========================================================================
  # OBSERVABILITY STACK
  # ==========================================================================

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ai-agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - agent-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: ai-agent-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - agent-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.3.1
    container_name: ai-agent-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - agent-network
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: ai-agent-langfuse
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-secret-in-production}
      NEXTAUTH_URL: http://localhost:3002
      SALT: ${SALT:-change-this-salt-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

  # ==========================================================================
  # BACKEND ORCHESTRATOR (Main API)
  # ==========================================================================

  orchestrator:
    build:
      context: .
      dockerfile: agents/servicenow_agent/Dockerfile
    container_name: ai-agent-orchestrator
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # LLM API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Database connections
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
      # Vector & Graph DBs
      WEAVIATE_URL: http://weaviate:8080
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-adminadmin}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # GCP Configuration
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-key.json
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      # Observability
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse:3000
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: orchestrator
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # External integrations (ServiceNow)
      SNOW_INSTANCE_URL: ${SNOW_INSTANCE_URL:-https://dev349960.service-now.com}
      SNOW_USERNAME: ${SNOW_USERNAME:-admin}
      SNOW_PASSWORD: ${SNOW_PASSWORD:-WjnAa$$9hW-Q0}
      GITHUB_TOKEN: ${GITHUB_REMEDIATION_TOKEN:-${GITHUB_TOKEN:-}}
      GITHUB_OWNER: ${GITHUB_REMEDIATION_OWNER:-sam2881}
      GITHUB_REPO: ${GITHUB_REMEDIATION_REPO:-test_01}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#ai-agent-alerts}
      # Enable real Kafka (not mock) for EventOrchestrator consumer
      MOCK_KAFKA: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./infrastructure/gcp-key.json}:/app/gcp-key.json:ro
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================================================
  # DATA AGENT API
  # ==========================================================================

  data-agent:
    build:
      context: .
      dockerfile: agents/data_agent/Dockerfile
    container_name: ai-agent-data
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      PYTHONPATH: /app
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # GitHub - Target Repository for DAGs
      GITHUB_TOKEN: ${GITHUB_PIPELINES_TOKEN:-${GITHUB_TOKEN:-}}
      GITHUB_OWNER: ${GITHUB_PIPELINES_OWNER:-sam2881}
      GITHUB_REPO: ${GITHUB_PIPELINES_REPO:-enterprise-data-pipelines}
      # GCP Configuration
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-key.json
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_REGION: ${GCP_REGION:-us-central1}
      GCS_BUCKET_RAW: ${GCS_BUCKET_RAW:-}
      GCS_BUCKET_BRONZE: ${GCS_BUCKET_BRONZE:-}
      GCS_BUCKET_SILVER: ${GCS_BUCKET_SILVER:-}
      GCS_BUCKET_GOLD: ${GCS_BUCKET_GOLD:-}
      GCS_BUCKET_TEMP: ${GCS_BUCKET_TEMP:-}
      # BigQuery
      BIGQUERY_DATASET: ${BIGQUERY_DATASET:-data_warehouse}
      BIGQUERY_LOCATION: ${BIGQUERY_LOCATION:-US}
      # Dataproc
      DATAPROC_CLUSTER: ${DATAPROC_CLUSTER:-}
      DATAPROC_REGION: ${DATAPROC_REGION:-us-central1}
      # Jira (for ticket updates from data agent)
      JIRA_URL: ${JIRA_URL:-}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-SCRUM}
      # Airflow (local testing only - production via CI/CD)
      AIRFLOW_API_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - airflow_dags:/opt/airflow/dags
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./infrastructure/gcp-key.json}:/app/gcp-key.json:ro
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================================================
  # MCP SERVERS (Event-Driven)
  # ==========================================================================

  # ServiceNow MCP Server
  # Polls ServiceNow → Publishes incident.created to Kafka
  # Consumes incident.close_execute → Closes tickets in ServiceNow
  servicenow-mcp:
    build:
      context: .
      dockerfile: agents/servicenow_agent/Dockerfile
    container_name: ai-agent-servicenow-mcp
    command: python /app/mcp-servers/servicenow-mcp/server.py
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SNOW_INSTANCE_URL: ${SNOW_INSTANCE_URL:-}
      SNOW_USERNAME: ${SNOW_USERNAME:-admin}
      SNOW_PASSWORD: ${SNOW_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SNOW_POLL_INTERVAL: "30"
      SNOW_POLL_LOOKBACK: "5"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

  # Jira MCP Server
  # Polls Jira for pipeline requests → Publishes pipeline.requested to Kafka
  # Consumes pipeline.completed/failed → Updates Jira tickets
  jira-mcp:
    build:
      context: .
      dockerfile: agents/servicenow_agent/Dockerfile
    container_name: ai-agent-jira-mcp
    command: python /app/mcp-servers/jira-mcp/server.py
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      JIRA_URL: ${JIRA_URL:-}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-DATA}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POLL_INTERVAL_SECONDS: "120"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

  # Airflow MCP Server (NEW)
  # Consumes airflow.trigger_dag → Triggers DAG via Airflow REST API
  # Publishes airflow.dag_completed → Notifies workflow of completion
  airflow-mcp:
    build:
      context: .
      dockerfile: agents/servicenow_agent/Dockerfile
    container_name: ai-agent-airflow-mcp
    command: python /app/mcp-servers/airflow-mcp/server.py
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      AIRFLOW_API_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

  # ==========================================================================
  # MONITORING SERVICES
  # ==========================================================================

  # GCP VM Monitor
  # Monitors GCP VMs and creates ServiceNow incidents for stopped/terminated VMs
  gcp-vm-monitor:
    build:
      context: .
      dockerfile: agents/servicenow_agent/Dockerfile
    container_name: ai-agent-gcp-vm-monitor
    command: ["python", "-m", "agents.servicenow_agent.src.streaming.gcp_vm_monitor"]
    environment:
      # GCP
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-agent-ai-test-461120}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-key.json
      GCP_POLL_INTERVAL: "60"
      # ServiceNow
      SNOW_INSTANCE_URL: ${SNOW_INSTANCE_URL:-}
      SNOW_USERNAME: ${SNOW_USERNAME:-admin}
      SNOW_PASSWORD: ${SNOW_PASSWORD:-}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./gcp-service-account-key.json:/app/gcp-key.json:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

  # Airflow DAG Monitor
  # Monitors Airflow for failed DAGs and creates ServiceNow incidents
  airflow-dag-monitor:
    build:
      context: .
      dockerfile: agents/servicenow_agent/Dockerfile
    container_name: ai-agent-airflow-dag-monitor
    command: ["python", "-m", "agents.servicenow_agent.src.streaming.airflow_dag_monitor"]
    environment:
      # Airflow
      AIRFLOW_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_POLL_INTERVAL: "60"
      AIRFLOW_LOOKBACK_MINUTES: "5"
      # ServiceNow
      SNOW_INSTANCE_URL: ${SNOW_INSTANCE_URL:-}
      SNOW_USERNAME: ${SNOW_USERNAME:-admin}
      SNOW_PASSWORD: ${SNOW_PASSWORD:-}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    networks:
      - agent-network
    restart: unless-stopped

  # ==========================================================================
  # DAG SYNC (GitHub → Airflow)
  # ==========================================================================
  # Polls enterprise-data-pipelines repo every 60s and syncs DAGs into Airflow
  dag-sync:
    image: alpine/git:2.43.0
    container_name: ai-agent-dag-sync
    environment:
      GIT_TOKEN: ${GITHUB_PIPELINES_TOKEN}
      GIT_OWNER: ${GITHUB_PIPELINES_OWNER:-sam2881}
      GIT_REPO: ${GITHUB_PIPELINES_REPO:-enterprise-data-pipelines}
      GIT_BRANCH: main
      SYNC_INTERVAL: "60"
    volumes:
      - airflow_dags:/dags
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        REPO_URL="https://$${GIT_TOKEN}@github.com/$${GIT_OWNER}/$${GIT_REPO}.git"
        REPO_DIR=/tmp/repo
        echo "[dag-sync] Cloning $${GIT_OWNER}/$${GIT_REPO} (branch: $${GIT_BRANCH})..."
        git clone --depth 1 -b $${GIT_BRANCH} "$${REPO_URL}" "$$REPO_DIR" 2>&1 || echo "[dag-sync] Clone failed, will retry"
        while true; do
          if [ -d "$$REPO_DIR/.git" ]; then
            cd "$$REPO_DIR"
            git fetch origin $${GIT_BRANCH} --depth 1 2>/dev/null && git reset --hard origin/$${GIT_BRANCH} 2>/dev/null || true
            if [ -d "$$REPO_DIR/dags" ]; then
              cp -f $$REPO_DIR/dags/*.py /dags/ 2>/dev/null && echo "[dag-sync] DAGs synced" || true
            fi
            if [ -d "$$REPO_DIR/spark_jobs" ]; then
              mkdir -p /dags/spark_jobs
              cp -rf $$REPO_DIR/spark_jobs/* /dags/spark_jobs/ 2>/dev/null || true
              echo "[dag-sync] Spark jobs synced"
            fi
            if [ -d "$$REPO_DIR/dag_utilities" ]; then
              mkdir -p /dags/dag_utilities
              cp -rf $$REPO_DIR/dag_utilities/* /dags/dag_utilities/ 2>/dev/null || true
              echo "[dag-sync] DAG utilities synced"
            fi
          else
            echo "[dag-sync] Repo not cloned yet, retrying..."
            git clone --depth 1 -b $${GIT_BRANCH} "$${REPO_URL}" "$$REPO_DIR" 2>&1 || true
          fi
          sleep $${SYNC_INTERVAL}
        done
    networks:
      - agent-network
    restart: unless-stopped

  # ==========================================================================
  # FRONTEND
  # ==========================================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://orchestrator:8000
    container_name: ai-agent-frontend
    ports:
      - "3000:3001"
    environment:
      BACKEND_URL: http://orchestrator:8000
      NEXT_PUBLIC_API_URL: http://${EXTERNAL_HOST:-localhost}:8000
      NEXT_PUBLIC_DATA_AGENT_URL: http://${EXTERNAL_HOST:-localhost}:8001
      NEXT_PUBLIC_WS_URL: ws://${EXTERNAL_HOST:-localhost}:8000
      NODE_ENV: production
    depends_on:
      - orchestrator
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  agent-network:
    driver: bridge
    name: ai-agent-network

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  redis_data:
  postgres_data:
  weaviate_data:
  neo4j_data:
  neo4j_logs:
  airflow_dags:
  airflow_logs:
  airflow_plugins:
  prometheus_data:
  grafana_data:
  tempo_data:
